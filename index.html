    <!-- GSAP & ScrollTrigger CDN -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        asphalt: '#0d0d0d',
                        offwhite: '#EDEDED',
                        cobalt: '#0052FF',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    letterSpacing: {
                        tighter: '-.04em',
                        widest: '.2em',
                    }
                }
            }
        }

    <style>
        body {
            background-color: #0d0d0d;
            color: #EDEDED;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(13, 13, 13, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(237, 237, 237, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease;
        }

        /* --- APPLE LIQUID GLASS BACKGROUND --- */
        .liquid-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: liquidFloat 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            mix-blend-mode: screen;
        }
        
        .blob-1 {
            width: 50vw; height: 50vw;
            background: rgba(0, 82, 255, 0.3);
            top: -10%; left: -10%;
        }
        
        .blob-2 {
            width: 40vw; height: 40vw;
            background: rgba(80, 0, 255, 0.2);
            bottom: -10%; right: -10%;
            animation-delay: -10s;
        }

        .glass-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(13, 13, 13, 0.1);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
        }

        @keyframes liquidFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(5%, 10%) scale(1.1) rotate(10deg); }
            100% { transform: translate(-5%, 5%) scale(0.9) rotate(-5deg); }
        }

        /* Testo Watermark Dietro Atomo */
        .text-outline {
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(237, 237, 237, 0.15);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* --- BOTTONI E FORM --- */
        .btn-primary {
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
        }
        @media (hover: hover) {
            .btn-primary:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 30px -5px rgba(0, 82, 255, 0.5);
            }
        }
        .btn-primary:active { transform: scale(0.97); }

        .form-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(237, 237, 237, 0.1);
            color: #EDEDED;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: #0052FF;
            background: rgba(0, 82, 255, 0.02);
            box-shadow: 0 0 20px rgba(0, 82, 255, 0.15);
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .letter { display: inline-block; will-change: transform, opacity; }

        /* Pallini Azzurri per il form */
        .custom-radio {
            -webkit-appearance: none;
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(237, 237, 237, 0.4);
            border-radius: 50%;
            background-color: transparent;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0;
            flex-shrink: 0;
        }
        .custom-radio:checked {
            border-color: #0052FF;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 0.6rem;
            height: 0.6rem;
            background-color: #0052FF;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 82, 255, 0.6);
        }
    </style>
</head>
